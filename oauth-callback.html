<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NOVA OAuth Callback</title>
  </head>
  <body>
    <script>
      // Parse query params
      function qp(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }
      const code = qp('code');
      const state = qp('state');
      // Post message to opener
      if (window.opener && (code || state)) {
        window.opener.postMessage({ type: 'oauth_callback', code, state }, '*');
      }
      // close the window shortly after
      setTimeout(() => window.close(), 500);
    </script>
    <div style="font-family: Inter, system-ui, sans-serif; padding: 20px; background:#050507; color:#e6eef6">Processing OAuth response… You can close this window.</div>
  </body>
</html>
